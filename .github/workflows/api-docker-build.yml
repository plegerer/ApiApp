name: Build and Push Docker Images

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================
      # LOGIN TO GHCR
      # =========================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================
      # SETUP BUILDX
      # =========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # =========================================
      # API METADATA
      # =========================================
      - name: Extract metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api
          tags: |
            type=raw,value=latest
            type=sha

      # =========================================
      # BUILD + PUSH API
      # =========================================
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ApiApp/Dockerfile
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =========================================
      # WORKER METADATA
      # =========================================
      - name: Extract metadata (Worker)
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/worker
          tags: |
            type=raw,value=latest
            type=sha

      # =========================================
      # BUILD + PUSH WORKER
      # =========================================
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./WorkerApp/Dockerfile
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/apps/api

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f
